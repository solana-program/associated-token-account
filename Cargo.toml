[workspace]
resolver = "2"
members = ["interface", "program", "mollusk_harness", "pinocchio/interface", "pinocchio/program"]

[workspace.dependencies]
codama = "0.13.2"
codama-macros = "0.13.2"
mollusk-svm = "0.15.1"
mollusk-svm-bencher = "0.15.1"
mollusk-svm-programs-token = "0.15.1"
mollusk-svm-result = "0.15.1"
pinocchio = { version = "0.11.2", default-features = false }
pinocchio-associated-token-account-interface = { path = "pinocchio/interface" }
pinocchio-log = "0.5.1"
pinocchio-system = "0.6.1"
pinocchio-token = "0.7.0"
pinocchio-token-2022 = "0.4.0"
solana-account = "4.3.2"
solana-address = "2.6.1"
solana-instruction = "3.4.1"
solana-logger = "3.0.0"
solana-nullable = "1.3.0"
solana-program-error = "3.0.1"
solana-program-option = "3.1.0"
solana-program-pack = "3.1.0"
solana-pubkey = "4.2.1"
solana-rent = "4.3.0"
solana-sdk-ids = "3.1.0"
solana-system-interface = "3.2.0"
solana-zero-copy = "1.2.0"
spl-associated-token-account-interface = { version = "2.0.0", path = "interface" }
spl-associated-token-account-mollusk-harness = { version = "1.0.0", path = "mollusk_harness" }
spl-token-2022-interface = "3.1.1"
spl-token-interface = "2.0.0"
test-case = "3.3.1"
wincode = { version = "0.6.1", default-features = false }

[workspace.metadata.spellcheck]
config = "scripts/spellcheck.toml"

[workspace.metadata.release]
pre-release-commit-message = "Publish {{crate_name}} v{{version}}"
tag-message = "Publish {{crate_name}} v{{version}}"
consolidate-commits = false

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-alloc", "custom-heap", "custom-panic", "frozen-abi", "no-entrypoint"))',
]
